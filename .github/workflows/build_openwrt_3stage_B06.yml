# 三阶段编译 OpenWrt - 更稳定，不会超时
# Stage 1: 准备环境和下载依赖 (约1小时)
# Stage 2: 编译工具链 (约2小时)
# Stage 3: 编译固件 (约2小时)
# 分阶段编译 MultiStage - 避免超时
# 禁用包签名验证


name: OpenWrt-CI-ThreeStage B06

on:
  workflow_dispatch:
  push:
    branches:
      - k5
    paths:
      - '.config'
      - '**.config'
      - 'feeds.conf.default'

permissions:
  contents: write

jobs:
  # ==================== 阶段 1: 准备环境 ====================
  stage1_prepare:
    name: "阶段1: 准备环境和下载依赖"
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          
          echo "✓ 编译依赖安装完成"
          echo ""
          echo "验证关键工具:"
          qemu-img --version | head -1
          mkisofs --version 2>&1 | head -1
          echo ""
          echo "关键工具版本检查:"
          qemu-img --version | head -1
          mkisofs --version 2>&1 | head -1
          which grub-mkimage && grub-mkimage --version || echo "⚠️  grub-mkimage 未安装"
      
      - name: 更新 feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default 2>/dev/null || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 清理有问题的包
        run: |
          rm -rf feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          echo "✓ 已清理有问题的软件包"
      
      - name: 生成配置文件
        run: |
          # 使用自定义配置（如果存在）
          if [ -f "defconfig" ]; then
            echo "使用 defconfig"
            cp defconfig .config
          elif [ -f "minimal.config" ]; then
            echo "使用 minimal.config"
            cp minimal.config .config
          elif [ -f "diffconfig" ]; then
            echo "使用 diffconfig"
            cp diffconfig .config
          fi
          
          # 只添加必要的优化配置
          cat >> .config <<EOF
          
          # 禁用有问题的包
          CONFIG_PACKAGE_luci-app-passwall2=n
          CONFIG_PACKAGE_luci-app-adguardhome=n
          CONFIG_PACKAGE_strongswan=n
          
          # 启用编译优化
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          
          # 禁用包签名验证
          CONFIG_SIGNED_PACKAGES=n
          EOF
          
          make defconfig
          
          echo "========== 配置已生成 =========="
          grep "^CONFIG_TARGET" .config | head -10
          echo ""
          echo "镜像格式配置:"
          grep -E "CONFIG_.*IMAGES=|CONFIG_TARGET_ROOTFS" .config | grep -v "^#"
      
      - name: 下载编译依赖包
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "✓ 依赖包下载完成"
      
      - name: 打包 Stage 1 产物
        run: |
          echo "打包 feeds 和下载的文件..."
          tar -czf feeds.tar.gz feeds/
          tar -czf dl.tar.gz dl/
          cp .config config.stage1
          echo "✓ Stage 1 打包完成"
      
      - name: 上传 Stage 1 产物
        uses: actions/upload-artifact@v4
        with:
          name: stage1-output
          path: |
            feeds.tar.gz
            dl.tar.gz
            config.stage1
          retention-days: 1
      
      - name: Stage 1 完成
        run: |
          echo "======================================"
          echo "✓ 阶段 1 完成！"
          echo "已上传: feeds, dl, config"
          echo "======================================"
          df -h

  # ==================== 阶段 2: 编译工具链 ====================
  stage2_toolchain:
    name: "阶段2: 编译工具链"
    needs: stage1_prepare
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          
          echo "✓ 编译依赖安装完成"
      
      - name: 下载 Stage 1 产物
        uses: actions/download-artifact@v4
        with:
          name: stage1-output
          path: ./stage1/
      
      - name: 恢复 Stage 1 环境
        run: |
          echo "恢复 feeds 和下载文件..."
          tar -xzf ./stage1/feeds.tar.gz
          echo "✓ feeds 解压完成，删除压缩包释放空间..."
          rm -f ./stage1/feeds.tar.gz
          
          tar -xzf ./stage1/dl.tar.gz
          echo "✓ dl 解压完成，删除压缩包释放空间..."
          rm -f ./stage1/dl.tar.gz
          
          cp ./stage1/config.stage1 .config
          
          echo "✓ Stage 1 环境已恢复"
          echo "配置文件:"
          ls -lh .config
          echo "dl 目录:"
          du -sh dl/
          echo "feeds 目录:"
          du -sh feeds/
          echo "磁盘空间:"
          df -h
      
      - name: 编译 tools
        run: |
          echo "=========================================="
          echo "开始编译 tools..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) tools/install V=s 2>&1 | tee tools_build.log
          
          echo "=========================================="
          echo "✓ tools 编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 120
      
      - name: 编译 toolchain
        run: |
          echo "=========================================="
          echo "开始编译 toolchain..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) toolchain/install V=s 2>&1 | tee toolchain_build.log
          
          echo "=========================================="
          echo "✓ toolchain 编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 120
      
      - name: 预编译目标相关组件
        run: |
          echo "=========================================="
          echo "预编译目标平台组件 (target/compile)..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          # 确保镜像生成工具可用
          echo "配置镜像生成工具..."
          mkdir -p staging_dir/host/bin/
          
          # 链接系统的 qemu-img
          if [ -f /usr/bin/qemu-img ]; then
            ln -sf /usr/bin/qemu-img staging_dir/host/bin/qemu-img
            echo "✓ qemu-img 已链接到 staging_dir"
          fi
          
          # 编译 target 相关的基础组件（包括 grub2）
          make -j$(nproc) target/compile V=s 2>&1 | tee target_compile.log || true
          
          echo "=========================================="
          echo "✓ 目标平台组件预编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          # 检查关键文件
          echo ""
          echo "检查关键组件:"
          find staging_dir/target-* -name "grub2" -o -name "boot.img" 2>/dev/null | head -10 || echo "未找到 grub2 相关文件"
          find staging_dir/host/bin/ -name "qemu-img" 2>/dev/null || echo "未找到 qemu-img"
        timeout-minutes: 120
      
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-build-logs
          path: |
            tools_build.log
            toolchain_build.log
            target_compile.log
          retention-days: 7
      
      - name: 打包 Stage 2 产物
        run: |
          echo "打包工具链和 staging 目录..."
          
          # 检查 staging_dir 内容
          echo "staging_dir 内容:"
          du -sh staging_dir/* 2>/dev/null || true
          
          # 打包完整的 staging_dir
          tar -czf staging_dir.tar.gz staging_dir/
          
          # 打包 build_dir/host
          tar -czf build_dir_host.tar.gz build_dir/host/ 2>/dev/null || true
          
          # 如果有 build_dir/target-* 也打包（包含预编译的组件）
          if [ -d "build_dir/target-x86_64_musl" ]; then
            echo "打包 target 预编译组件..."
            tar -czf build_dir_target.tar.gz build_dir/target-x86_64_musl/ 2>/dev/null || true
          fi
          
          cp .config config.stage2
          
          echo "✓ Stage 2 打包完成"
          echo "产物大小:"
          ls -lh *.tar.gz
      
      - name: 上传 Stage 2 产物
        uses: actions/upload-artifact@v4
        with:
          name: stage2-output
          path: |
            staging_dir.tar.gz
            build_dir_host.tar.gz
            build_dir_target.tar.gz
            config.stage2
          retention-days: 1
      
      - name: Stage 2 完成
        run: |
          echo "======================================"
          echo "✓ 阶段 2 完成！"
          echo "已上传: toolchain, staging_dir"
          echo "======================================"
          df -h

  # ==================== 阶段 3: 编译固件 ====================
  stage3_firmware:
    name: "阶段3: 编译固件"
    needs: stage2_toolchain
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
      
      - name: 下载 Stage 1 产物
        uses: actions/download-artifact@v4
        with:
          name: stage1-output
          path: ./stage1/
      
      - name: 下载 Stage 2 产物
        uses: actions/download-artifact@v4
        with:
          name: stage2-output
          path: ./stage2/
      
      - name: 恢复完整编译环境
        run: |
          echo "=========================================="
          echo "恢复 Stage 1 环境..."
          echo "=========================================="
          tar -xzf ./stage1/feeds.tar.gz
          echo "✓ feeds 解压完成，删除压缩包..."
          rm -f ./stage1/feeds.tar.gz
          
          tar -xzf ./stage1/dl.tar.gz
          echo "✓ dl 解压完成，删除压缩包..."
          rm -f ./stage1/dl.tar.gz
          
          echo "=========================================="
          echo "恢复 Stage 2 工具链..."
          echo "=========================================="
          tar -xzf ./stage2/staging_dir.tar.gz
          echo "✓ staging_dir 解压完成，删除压缩包..."
          rm -f ./stage2/staging_dir.tar.gz
          
          tar -xzf ./stage2/build_dir_host.tar.gz
          echo "✓ build_dir_host 解压完成，删除压缩包..."
          rm -f ./stage2/build_dir_host.tar.gz
          
          # 恢复 target 预编译组件（如果存在）
          if [ -f "./stage2/build_dir_target.tar.gz" ]; then
            echo "恢复 target 预编译组件..."
            tar -xzf ./stage2/build_dir_target.tar.gz
            echo "✓ build_dir_target 解压完成，删除压缩包..."
            rm -f ./stage2/build_dir_target.tar.gz
          fi
          
          echo "恢复配置文件..."
          cp ./stage2/config.stage2 .config
          
          echo "=========================================="
          echo "✓ 编译环境已完全恢复"
          echo "=========================================="
          echo "配置:"
          ls -lh .config
          echo "工具链:"
          du -sh staging_dir/
          echo "dl 目录:"
          du -sh dl/
          echo ""
          echo "检查关键文件:"
          find staging_dir/target-* -name "grub2" -o -name "*.img" 2>/dev/null | head -5 || echo "未找到 grub2"
          echo ""
          echo "磁盘空间:"
          df -h
          echo "=========================================="
      
      - name: 重新安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 配置系统工具链接
        run: |
          echo "=========================================="
          echo "配置镜像生成工具..."
          echo "=========================================="
          
          # 验证 qemu-img 是否安装
          if ! command -v qemu-img >/dev/null 2>&1; then
            echo "❌ 错误: qemu-img 未安装！"
            echo "尝试重新安装..."
            sudo apt update
            sudo apt install -y qemu-utils
          fi
          
          # 再次验证
          if ! command -v qemu-img >/dev/null 2>&1; then
            echo "❌ 致命错误: 无法安装 qemu-img"
            exit 1
          fi
          
          echo "✓ qemu-img 可用: $(which qemu-img)"
          qemu-img --version | head -1
          
          # 创建符号链接到 staging_dir
          mkdir -p staging_dir/host/bin/
          
          # 链接 qemu-img
          QEMU_PATH=$(which qemu-img)
          ln -sf "$QEMU_PATH" staging_dir/host/bin/qemu-img
          echo "✓ qemu-img 已链接: $QEMU_PATH -> staging_dir/host/bin/qemu-img"
          
          # 链接其他可能需要的工具
          for tool in mkisofs genisoimage; do
            if command -v $tool >/dev/null 2>&1; then
              TOOL_PATH=$(which $tool)
              ln -sf "$TOOL_PATH" staging_dir/host/bin/$tool 2>/dev/null || true
              echo "✓ $tool 已链接"
            fi
          done
          
          echo ""
          echo "验证工具链接:"
          ls -lh staging_dir/host/bin/ | grep -E "qemu|iso" || echo "未找到链接"
          
          echo ""
          echo "测试 qemu-img 可执行性:"
          if [ -x staging_dir/host/bin/qemu-img ]; then
            staging_dir/host/bin/qemu-img --version | head -1
            echo "✓ qemu-img 工作正常"
          else
            echo "❌ qemu-img 不可执行"
            exit 1
          fi
          
          echo "=========================================="
      
      - name: 编译固件包
        run: |
          echo "=========================================="
          echo "开始编译软件包..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) package/compile V=s 2>&1 | tee package_build.log || \
          make -j1 package/compile V=s 2>&1 | tee -a package_build.log
          
          echo "=========================================="
          echo "✓ 软件包编译完成"
          echo "=========================================="
          echo ""
          echo "开始安装软件包到根文件系统..."
          echo "=========================================="
          
          make -j$(nproc) package/install V=s 2>&1 | tee -a package_build.log
          
          echo "=========================================="
          echo "✓ 软件包安装完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          # 验证 root 目录是否存在
          echo ""
          echo "验证根文件系统目录:"
          ROOT_DIR=$(find ./build_dir/target-*/root-* -maxdepth 0 -type d 2>/dev/null | head -1)
          if [ -n "$ROOT_DIR" ]; then
            echo "✓ 找到根文件系统: $ROOT_DIR"
            echo "目录大小:"
            du -sh "$ROOT_DIR"
            echo "内容预览:"
            ls -lh "$ROOT_DIR" | head -20
          else
            echo "❌ 错误: 根文件系统目录不存在！"
            echo "查找所有 build_dir 内容:"
            find ./build_dir -maxdepth 3 -type d | grep -E "root-|target-"
            exit 1
          fi
        timeout-minutes: 180
      
      - name: 编译固件镜像
        id: compile_image
        run: |
          echo "=========================================="
          echo "开始生成固件镜像..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          # 检查配置
          echo "目标设备配置:"
          grep "^CONFIG_TARGET" .config | head -5
          echo ""
          echo "镜像格式配置:"
          grep -E "CONFIG_.*IMAGES=" .config | grep -v "^#" | head -10
          echo "=========================================="
          
          # 第一步：安装目标文件
          echo "步骤 1/5: target/install"
          make -j$(nproc) target/install V=s 2>&1 | tee target_build.log
          TARGET_RESULT=${PIPESTATUS[0]}
          
          if [ $TARGET_RESULT -ne 0 ]; then
            echo "❌ target/install 失败！退出码: $TARGET_RESULT"
            echo "查看最后 100 行错误:"
            tail -100 target_build.log
            exit 1
          fi
          echo "✓ target/install 完成"
          
          # 第二步：生成包索引
          echo ""
          echo "步骤 2/5: package/index"
          make -j$(nproc) package/index V=s 2>&1 | tee -a target_build.log
          echo "✓ package/index 完成"
          
          # 第三步：生成 JSON 信息
          echo ""
          echo "步骤 3/5: json_overview_image_info"
          make -j$(nproc) json_overview_image_info V=s 2>&1 | tee -a target_build.log || true
          
          # 第四步：生成校验和
          echo ""
          echo "步骤 4/5: checksum"
          make -j$(nproc) checksum V=s 2>&1 | tee -a target_build.log
          echo "✓ checksum 完成"
          
          # 第五步：强制生成镜像（如果还没有）
          echo ""
          echo "步骤 5/5: 检查并强制生成镜像"
          
          # 检查是否已经有镜像文件
          IMG_COUNT=$(find ./bin/targets/ -type f \( -name "*.img" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" -o -name "*.qcow2" \) 2>/dev/null | wc -l)
          
          if [ $IMG_COUNT -eq 0 ]; then
            echo "⚠️  警告: 未找到镜像文件，尝试强制生成..."
            make -j1 target/install V=sc 2>&1 | tee -a target_build.log || true
            
            # 再次检查
            IMG_COUNT=$(find ./bin/targets/ -type f \( -name "*.img" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" -o -name "*.qcow2" \) 2>/dev/null | wc -l)
            
            if [ $IMG_COUNT -eq 0 ]; then
              echo "❌ 仍然没有生成镜像文件！"
              echo ""
              echo "查看 image 相关的 make 目标:"
              make -j1 target/linux/install V=sc 2>&1 | tee -a target_build.log || true
            fi
          else
            echo "✓ 找到 $IMG_COUNT 个镜像文件"
          fi
          
          echo "=========================================="
          echo "✓ 固件编译流程完成！"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          # 立即检查生成的所有文件
          echo ""
          echo "生成的文件列表:"
          find ./bin/targets/ -type f 2>/dev/null | sort
          
          echo "status=success" >> $GITHUB_OUTPUT
        timeout-minutes: 60
      
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-build-logs
          path: |
            package_build.log
            target_build.log
          retention-days: 7
      
      - name: 诊断 - 完整的 bin 目录分析
        if: always()
        run: |
          echo "=========================================="
          echo "完整诊断信息"
          echo "=========================================="
          
          echo "1. .config 中的目标设备:"
          grep "^CONFIG_TARGET" .config || echo "未找到 TARGET 配置"
          
          echo ""
          echo "2. bin 目录是否存在:"
          ls -ld ./bin 2>/dev/null || echo "bin 目录不存在"
          
          echo ""
          echo "3. bin/targets 目录结构:"
          ls -lhR ./bin/targets/ 2>/dev/null || echo "targets 目录不存在"
          
          echo ""
          echo "4. 查找所有固件相关文件:"
          find ./bin/ -type f 2>/dev/null | grep -E "\.(bin|img|vmdk|trx)$" || echo "未找到固件文件"
          
          echo ""
          echo "5. 检查 target 编译目录:"
          ls -lh ./build_dir/target-*/linux-*/tmp/ 2>/dev/null || echo "未找到 target 编译目录"
          
          echo ""
          echo "6. 最后 100 行 make 输出:"
          tail -100 target_build.log 2>/dev/null || echo "日志文件不存在"
          
          echo "=========================================="
      
      - name: 检查编译产物
        run: |
          echo "======================================"
          echo "检查 bin 目录结构:"
          ls -lhR ./bin/ || echo "bin 目录不存在！"
          echo "======================================"
          echo "查找固件文件:"
          find ./bin/targets/ -type f 2>/dev/null || echo "targets 目录不存在！"
          echo "======================================"
          echo "查找所有可能的固件文件:"
          find ./bin/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.trx" -o -name "*.chk" \) 2>/dev/null || echo "未找到固件文件！"
          echo "======================================"
          echo "磁盘使用情况:"
          df -h
          echo "======================================"
      
      - name: 准备固件文件
        id: prepare_firmware
        run: |
          mkdir -p ./firmware
          
          echo "======================================"
          echo "正在收集固件文件..."
          echo "======================================"
          
          # 查找所有可能的固件文件
          FOUND_FILES=0
          
          # 查找固件镜像
          for file in $(find ./bin/targets/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.trx" -o -name "*.chk" \) 2>/dev/null); do
            echo "找到固件: $file"
            cp "$file" ./firmware/
            FOUND_FILES=$((FOUND_FILES + 1))
          done
          
          # 查找配置和信息文件
          for file in $(find ./bin/targets/ -type f \( -name "*.manifest" -o -name "*.buildinfo" -o -name "sha256sums" -o -name "*.json" \) 2>/dev/null); do
            echo "找到配置文件: $file"
            cp "$file" ./firmware/
          done
          
          echo "======================================"
          if [ $FOUND_FILES -eq 0 ]; then
            echo "❌ 错误: 未找到任何固件文件！"
            echo "======================================"
            echo "bin/targets 目录内容:"
            ls -lhR ./bin/targets/ 2>/dev/null || echo "目录不存在"
            echo "======================================"
            echo "请检查编译是否真的成功了"
            exit 1
          else
            echo "✓ 找到 $FOUND_FILES 个固件文件"
            echo "======================================"
            echo "固件目录内容:"
            ls -lh ./firmware/
            echo "======================================"
          fi
          
          # 生成带日期的名称
          FIRMWARE_NAME="OpenWrt_firmware_$(date +"%Y%m%d")"
          echo "firmware_name=${FIRMWARE_NAME}" >> $GITHUB_OUTPUT
      
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_firmware.outputs.firmware_name }}
          path: ./firmware/
      
      - name: 生成 Release 信息
        id: release_info
        run: |
          RELEASE_TAG="OpenWrt_$(date +"%Y.%m.%d_%H%M")"
          RELEASE_NAME="OpenWrt 固件 - $(date +"%Y.%m.%d")"
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          
          cat > release.txt <<EOF
          ## 🎉 OpenWrt 固件编译完成
          
          ### 📅 编译信息
          - 编译时间: $(date +"%Y年%m月%d日 %H:%M:%S")
          - 编译分支: k5
          - 三阶段编译
          
          ### 📦 固件文件
          \`\`\`
          $(ls -lh ./firmware/)
          \`\`\`
          
          ### ✅ 编译成功！
          EOF
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release.txt
          files: ./firmware/*
      
      - name: Stage 3 完成
        run: |
          echo "======================================"
          echo "🎉 所有阶段完成！"
          echo "✓ 阶段 1: 准备环境"
          echo "✓ 阶段 2: 编译工具链"
          echo "✓ 阶段 3: 编译固件"
          echo "======================================"
          echo "固件已上传到 Release!"
          echo "======================================"