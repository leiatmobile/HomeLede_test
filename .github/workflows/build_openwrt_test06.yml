# 分阶段编译 MultiStage - 避免超时
# 如果单次编译还是超时，使用这个版本
# 删除有问题的 feeds：
# homelede-dns-bundle（缺少 AdGuardHome 依赖）
# luci-app-adguardhome（缺少 AdGuardHome 依赖）
# 禁用循环依赖的包：luci-app-passwall2 strongswan

name: build openwrt 06 MultiStage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 第一阶段：准备工具链
  prepare:
    name: 准备编译环境
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential ccache flex bison g++ gawk git gettext libncurses5-dev libssl-dev python3 rsync unzip zlib1g-dev file wget
      
      - name: 更新 feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 清理有问题的包
        run: |
          # 删除导致循环依赖的包
          rm -rf feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          echo "已清理有问题的软件包"
      
      - name: 生成配置并修复依赖冲突
        run: |
          # 如果有自定义配置
          if [ -f "minimal.config" ]; then
            cp minimal.config .config
          fi
          
          # 禁用有问题的包，避免循环依赖
          cat >> .config <<EOF
          # 禁用导致循环依赖的包
          CONFIG_PACKAGE_luci-app-passwall2=n
          CONFIG_PACKAGE_luci-app-adguardhome=n
          CONFIG_PACKAGE_strongswan=n
          CONFIG_PACKAGE_strongswan-mod-updown=n
          
          # 启用基础防火墙
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip6tables=y
          
          # 启用 ccache 加速
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          EOF
          
          # 生成最终配置
          make defconfig
          
          echo "========== 配置已生成 =========="
          grep "^CONFIG_TARGET" .config
      
      - name: 下载依赖
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
      
      - name: 编译工具链
        run: |
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install
        timeout-minutes: 180
      
      - name: 打包工具链
        run: |
          tar -czf staging.tar.gz staging_dir/
          tar -czf dl.tar.gz dl/
      
      - name: 上传工具链
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-toolchain
          path: |
            staging.tar.gz
            dl.tar.gz
            .config
          retention-days: 1

  # 第二阶段：编译固件
  build:
    name: 编译固件
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
      
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential ccache flex bison g++ gawk git gettext libncurses5-dev libssl-dev python3 rsync unzip zlib1g-dev file wget
      
      - name: 下载工具链
        uses: actions/download-artifact@v4
        with:
          name: openwrt-toolchain
      
      - name: 解压工具链
        run: |
          tar -xzf staging.tar.gz
          tar -xzf dl.tar.gz
      
      - name: 更新 feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 清理有问题的包
        run: |
          # 删除导致循环依赖的包
          rm -rf feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          echo "已清理有问题的软件包"
      
      - name: 加载配置
        run: |
          # 使用 Stage 1 生成的配置
          if [ -f ".config" ]; then
            echo "使用 prepare 阶段的配置"
          else
            echo "错误：找不到配置文件"
            exit 1
          fi
      
      - name: 编译固件
        run: |
          make -j$(nproc) V=s
        timeout-minutes: 300
      
      - name: 准备产物
        run: |
          mkdir -p ./artifact/firmware
          cp -rf $(find ./bin/targets/ -type f) ./artifact/firmware/
      
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./artifact/firmware/
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: OpenWrt_$(date +"%Y%m%d_%H%M")
          files: ./artifact/firmware/*