# 三阶段编译 OpenWrt - 更稳定，不会超时
# Stage 1: 准备环境和下载依赖 (约1小时)
# Stage 2: 编译工具链 (约2小时)
# Stage 3: 编译固件 (约2小时)

# 禁用包签名验证
# 分阶段编译 MultiStage - 避免超时
# 删除有问题的 feeds：
# homelede-dns-bundle（缺少 AdGuardHome 依赖）
# luci-app-adguardhome（缺少 AdGuardHome 依赖）
# 禁用循环依赖的包：luci-app-passwall2 strongswan

name: OpenWrt-CI-ThreeStage B01

on:
  workflow_dispatch:
  push:
    branches:
      - k5
    paths:
      - '.config'
      - '**.config'
      - 'feeds.conf.default'

permissions:
  contents: write

jobs:
  # ==================== 阶段 1: 准备环境 ====================
  stage1_prepare:
    name: "阶段1️⃣ 准备环境和下载依赖"
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential ccache ecj fastjar file flex g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-distutils \
          python3-setuptools rsync subversion swig time unzip wget xsltproc \
          zlib1g-dev
          echo "编译依赖安装完成"
      
      - name: 更新 feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default 2>/dev/null || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 清理有问题的包
        run: |
          rm -rf feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/homelede-dns-bundle 2>/dev/null || true
          rm -rf package/feeds/xiaoqingfeng/luci-app-adguardhome 2>/dev/null || true
          echo "✓ 已清理有问题的软件包"
      
      - name: 生成配置文件
        run: |
          # 使用自定义配置（如果存在）
          if [ -f "minimal.config" ]; then
            echo "使用 minimal.config"
            cp minimal.config .config
          elif [ -f "diffconfig" ]; then
            echo "使用 diffconfig"
            cp diffconfig .config
          fi
          
          # 添加优化配置
          cat >> .config <<EOF
          # 禁用有问题的包
          CONFIG_PACKAGE_luci-app-passwall2=n
          CONFIG_PACKAGE_luci-app-adguardhome=n
          CONFIG_PACKAGE_strongswan=n
          
          # 启用编译优化
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=n
          
          # 禁用包签名验证
          CONFIG_SIGNED_PACKAGES=n
          EOF
          
          make defconfig
          
          echo "========== 配置已生成 =========="
          grep "^CONFIG_TARGET" .config | head -10
          grep "SIGNED_PACKAGES" .config
      
      - name: 下载编译依赖包
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "✓ 依赖包下载完成"
      
      - name: 打包 Stage 1 产物
        run: |
          echo "打包 feeds 和下载的文件..."
          tar -czf feeds.tar.gz feeds/
          tar -czf dl.tar.gz dl/
          cp .config config.stage1
          echo "✓ Stage 1 打包完成"
      
      - name: 上传 Stage 1 产物
        uses: actions/upload-artifact@v4
        with:
          name: stage1-output
          path: |
            feeds.tar.gz
            dl.tar.gz
            config.stage1
          retention-days: 1
      
      - name: Stage 1 完成
        run: |
          echo "======================================"
          echo "✓ 阶段 1 完成！"
          echo "已上传: feeds, dl, config"
          echo "======================================"
          df -h

  # ==================== 阶段 2: 编译工具链 ====================
  stage2_toolchain:
    name: "阶段2️⃣ 编译工具链"
    needs: stage1_prepare
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential ccache ecj fastjar file flex g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-distutils \
          python3-setuptools rsync subversion swig time unzip wget xsltproc \
          zlib1g-dev
      
      - name: 下载 Stage 1 产物
        uses: actions/download-artifact@v4
        with:
          name: stage1-output
          path: ./stage1/
      
      - name: 恢复 Stage 1 环境
        run: |
          echo "恢复 feeds 和下载文件..."
          tar -xzf ./stage1/feeds.tar.gz
          echo "✓ feeds 解压完成，删除压缩包释放空间..."
          rm -f ./stage1/feeds.tar.gz
          
          tar -xzf ./stage1/dl.tar.gz
          echo "✓ dl 解压完成，删除压缩包释放空间..."
          rm -f ./stage1/dl.tar.gz
          
          cp ./stage1/config.stage1 .config
          
          echo "✓ Stage 1 环境已恢复"
          echo "配置文件:"
          ls -lh .config
          echo "dl 目录:"
          du -sh dl/
          echo "feeds 目录:"
          du -sh feeds/
          echo "磁盘空间:"
          df -h
      
      - name: 编译 tools
        run: |
          echo "=========================================="
          echo "开始编译 tools..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) tools/install V=s 2>&1 | tee tools_build.log
          
          echo "=========================================="
          echo "✓ tools 编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 120
      
      - name: 编译 toolchain
        run: |
          echo "=========================================="
          echo "开始编译 toolchain..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) toolchain/install V=s 2>&1 | tee toolchain_build.log
          
          echo "=========================================="
          echo "✓ toolchain 编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 120
      
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-build-logs
          path: |
            tools_build.log
            toolchain_build.log
          retention-days: 7
      
      - name: 打包 Stage 2 产物
        run: |
          echo "打包工具链..."
          tar -czf staging_dir.tar.gz staging_dir/
          tar -czf build_dir_host.tar.gz build_dir/host/
          cp .config config.stage2
          
          echo "✓ Stage 2 打包完成"
          echo "产物大小:"
          ls -lh *.tar.gz
      
      - name: 上传 Stage 2 产物
        uses: actions/upload-artifact@v4
        with:
          name: stage2-output
          path: |
            staging_dir.tar.gz
            build_dir_host.tar.gz
            config.stage2
          retention-days: 1
      
      - name: Stage 2 完成
        run: |
          echo "======================================"
          echo "✓ 阶段 2 完成！"
          echo "已上传: toolchain, staging_dir"
          echo "======================================"
          df -h

  # ==================== 阶段 3: 编译固件 ====================
  stage3_firmware:
    name: "阶段3️⃣ 编译固件"
    needs: stage2_toolchain
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential ccache ecj fastjar file flex g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-distutils \
          python3-setuptools rsync subversion swig time unzip wget xsltproc \
          zlib1g-dev
      
      - name: 下载 Stage 1 产物
        uses: actions/download-artifact@v4
        with:
          name: stage1-output
          path: ./stage1/
      
      - name: 下载 Stage 2 产物
        uses: actions/download-artifact@v4
        with:
          name: stage2-output
          path: ./stage2/
      
      - name: 恢复完整编译环境
        run: |
          echo "=========================================="
          echo "恢复 Stage 1 环境..."
          echo "=========================================="
          tar -xzf ./stage1/feeds.tar.gz
          echo "✓ feeds 解压完成，删除压缩包..."
          rm -f ./stage1/feeds.tar.gz
          
          tar -xzf ./stage1/dl.tar.gz
          echo "✓ dl 解压完成，删除压缩包..."
          rm -f ./stage1/dl.tar.gz
          
          echo "=========================================="
          echo "恢复 Stage 2 工具链..."
          echo "=========================================="
          tar -xzf ./stage2/staging_dir.tar.gz
          echo "✓ staging_dir 解压完成，删除压缩包..."
          rm -f ./stage2/staging_dir.tar.gz
          
          tar -xzf ./stage2/build_dir_host.tar.gz
          echo "✓ build_dir_host 解压完成，删除压缩包..."
          rm -f ./stage2/build_dir_host.tar.gz
          
          echo "恢复配置文件..."
          cp ./stage2/config.stage2 .config
          
          echo "=========================================="
          echo "✓ 编译环境已完全恢复"
          echo "=========================================="
          echo "配置:"
          ls -lh .config
          echo "工具链:"
          du -sh staging_dir/
          echo "dl 目录:"
          du -sh dl/
          echo "磁盘空间:"
          df -h
          echo "=========================================="
      
      - name: 重新安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 编译固件包
        run: |
          echo "=========================================="
          echo "开始编译软件包..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) package/compile V=s 2>&1 | tee package_build.log || \
          make -j1 package/compile V=s 2>&1 | tee -a package_build.log
          
          echo "=========================================="
          echo "✓ 软件包编译完成"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 180
      
      - name: 编译固件镜像
        run: |
          echo "=========================================="
          echo "开始生成固件镜像..."
          echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          make -j$(nproc) target/install V=s 2>&1 | tee target_build.log
          make -j$(nproc) package/index V=s 2>&1 | tee -a target_build.log
          make -j$(nproc) json_overview_image_info V=s 2>&1 | tee -a target_build.log
          make -j$(nproc) checksum V=s 2>&1 | tee -a target_build.log
          
          echo "=========================================="
          echo "✓ 固件编译完成！"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
        timeout-minutes: 60
      
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-build-logs
          path: |
            package_build.log
            target_build.log
          retention-days: 7
      
      - name: 检查编译产物
        run: |
          echo "======================================"
          echo "编译产物:"
          find ./bin/targets/ -type f -name "*.bin" -o -name "*.img.gz" -o -name "*.vmdk"
          echo "======================================"
          echo "磁盘使用情况:"
          df -h
      
      - name: 准备固件文件
        id: prepare_firmware
        run: |
          mkdir -p ./firmware
          find ./bin/targets/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.manifest" -o -name "*.buildinfo" \) -exec cp {} ./firmware/ \;
          ls -lh ./firmware/
          
          # 生成带日期的名称
          FIRMWARE_NAME="OpenWrt_firmware_$(date +"%Y%m%d")"
          echo "firmware_name=${FIRMWARE_NAME}" >> $GITHUB_OUTPUT
      
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_firmware.outputs.firmware_name }}
          path: ./firmware/
      
      - name: 生成 Release 信息
        id: release_info
        run: |
          RELEASE_TAG="OpenWrt_$(date +"%Y.%m.%d_%H%M")"
          RELEASE_NAME="OpenWrt 固件 - $(date +"%Y.%m.%d")"
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          
          cat > release.txt <<EOF
          ## 🎉 OpenWrt 固件编译完成
          
          ### 📅 编译信息
          - 编译时间: $(date +"%Y年%m月%d日 %H:%M:%S")
          - 编译分支: k5
          - 三阶段编译
          
          ### 📦 固件文件
          \`\`\`
          $(ls -lh ./firmware/)
          \`\`\`
          
          ### ✅ 编译成功！
          EOF
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release.txt
          files: ./firmware/*
      
      - name: Stage 3 完成
        run: |
          echo "======================================"
          echo "🎉 所有阶段完成！"
          echo "✓ 阶段 1: 准备环境"
          echo "✓ 阶段 2: 编译工具链"
          echo "✓ 阶段 3: 编译固件"
          echo "======================================"
          echo "固件已上传到 Release!"

          echo "======================================"
