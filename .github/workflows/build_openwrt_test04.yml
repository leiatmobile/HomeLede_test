name: build openwrt 04 cache optimized

on:
  push:
    branches:
      - k5
  # schedule:
  #  - cron: 0 20 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
      
      - name: 释放 GitHub Actions 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-mark hold grub-efi-amd64-signed
          sudo apt update
          sudo apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* moby* snap* || true
          sudo apt -y full-upgrade
          sudo apt -y install ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo systemctl daemon-reload
          sudo apt -y autoremove --purge
          sudo apt clean
          sudo timedatectl set-timezone "Asia/Shanghai"
      
      - name: 检查初始磁盘空间
        run: |
          echo "======================初始磁盘空间======================"
          df -hT
          echo "======================================================="
      
      - name: 更新 feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: 生成配置文件
        run: |
          # 使用精简配置（如果存在）
          if [ -f "minimal.config" ]; then
            echo "使用精简配置文件"
            cp minimal.config .config
          elif [ -f "diffconfig" ]; then
            cp diffconfig .config
          elif [ -f "defconfig" ]; then
            cp defconfig .config
          fi
          make defconfig
          
          # 优化配置以加速编译
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_BUILD_LOG=n" >> .config
          
          make defconfig
          echo "当前配置："
          cat .config | grep "^CONFIG" | head -30
      
      - name: 下载编译依赖
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
      
      - name: 编译前检查磁盘空间
        run: |
          echo "======================编译前磁盘空间===================="
          df -hT
          echo "======================================================="
      
      - name: 编译固件
        run: |
          echo "开始编译，使用 $(nproc) 线程"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "======================="
          echo "编译完成！空间使用情况："
          echo "======================="
          df -hT
          echo "======================="
          echo "目录大小："
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin 2>/dev/null || true
          du -h --max-depth=1 ./build_dir 2>/dev/null || true
          du -h --max-depth=1 ./bin 2>/dev/null || true
        id: compile
      
      - name: 清理编译临时文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt 2>/dev/null || cd ./
          rm -rf build_dir/target-*/root-* 2>/dev/null || true
          rm -rf build_dir/host/stamp 2>/dev/null || true
          rm -rf staging_dir/target-*/root-* 2>/dev/null || true
          echo "清理后磁盘空间："
          df -hT
      
      - name: 准备产物
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          mkdir -p ./artifact/firmware
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/ 2>/dev/null || true
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/ 2>/dev/null || true
          cp -rf $(find ./bin/targets/ -type f) ./artifact/firmware/ 2>/dev/null || true
          echo "产物准备完成"
          ls -lh ./artifact/firmware/ || true
      
      - name: 上传 buildinfo
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenWrt_buildinfo_${{ github.run_number }}
          path: ./artifact/buildinfo/
      
      - name: 上传 package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenWrt_package_${{ github.run_number }}
          path: ./artifact/package/
      
      - name: 上传 firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenWrt_firmware_${{ github.run_number }}
          path: ./artifact/firmware/
      
      - name: 生成 release 标签
        id: tag
        if: success()
        run: |
          echo "release_tag=OpenWrt_$(date +"%Y.%m.%d_%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y年%m月%d日 %H:%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "## OpenWrt 固件编译完成" >> release.txt
          echo "" >> release.txt
          echo "📅 编译时间: $(date +"%Y年%m月%d日 %H:%M:%S")" >> release.txt
          echo "" >> release.txt
          echo "### 固件文件" >> release.txt
          echo '```' >> release.txt
          ls -lh ./artifact/firmware/ >> release.txt 2>&1 || true
          echo '```' >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: 上传固件到 Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ./artifact/firmware/*
      
      - name: 清理旧的 workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3
      
      - name: 清理旧的 Releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        if: success()
        with:
          keep_latest: 5
          delete_tags: true
        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

